# Views over LATENESS tables equal the batch query when inputs respect their
# bounds, by both reads. One scenario per late subject.

- id: feldera.late_aggregate
  runner: temper
  name: The aggregate view over LATENESS tables equals its query without lateness, by both reads
  description: >
    Time moves forward and no row is sent or deleted more than 50 minutes
    behind the latest timestamp, inside the 1-hour bound. After each request
    the view is compared with DuckDB running its query with no lateness, by
    the ad-hoc read and by its change stream, at 4 workers, then 1 and 8.
  subject: late.aggregate
  compose: temper/compose.yml
  covers: [late.changes_add_up, view.lateness_preserves_output, sql.lateness]
  events:
    - compiler_cache: []
    - compiler_prune: []                            # per-program artifacts from earlier runs
    - up: {feldera: 1}
    - check:
        results: {oracle: [legacy, "{subject}"], decides: [late.changes_add_up, view.lateness_preserves_output, sql.lateness]}

