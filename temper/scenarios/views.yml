# Every materialized view equals its query run from scratch, by both reads,
# at 4 workers and again at 1 and 8. One scenario per view subject, so each
# subject's feature lands on its own record. Each run compiles nothing new:
# the views program is in the compiler cache after the first.

- id: feldera.view_aggregate
  runner: temper
  name: The aggregate view equals its query run from scratch, by both reads, at 1, 4 and 8 workers
  description: >
    A seeded workload inserts and deletes rows in single requests, and
    drains a table to empty. Before the first request and after each, the
    view is compared with DuckDB running its query over the same rows, by
    the ad-hoc read and by its change stream summed from empty.
  subject: view.aggregate
  compose: temper/compose.yml
  covers: [runtime.workers, view.changes_add_up, view.matches_batch, workers.contract/w1, workers.contract/w8, connector.http, sql.aggregate, sql.primary_key]
  events:
    - compiler_cache: []
    - compiler_prune: []                            # per-program artifacts from earlier runs
    - up: {feldera: 1}
    - check:
        results: {oracle: [legacy, "{subject}"], decides: [runtime.workers, view.changes_add_up, view.matches_batch, workers.contract/w1, workers.contract/w8, connector.http, sql.aggregate, sql.primary_key]}

