# The topology for Feldera's scenarios (temper/scenarios).
#
# Feldera's compiler cache lives on the external volume
# temper-feldera-compiler, so a program compiles once across runs and
# subjects; the runner's teardown (down -v) never removes an external
# volume. Each scenario creates it first (docker volume create is
# idempotent), and Docker seeds it from the image's precompiled crates.
services:
  feldera:
    image: images.feldera.com/feldera/pipeline-manager:0.383.0
    volumes:
      - compiler:/home/ubuntu/.feldera/compiler

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    # Ready means the broker answers, not just that the container runs.
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 2s
      timeout: 10s
      retries: 60

  postgres:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: temper, POSTGRES_DB: sink}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "sink"]
      interval: 1s
      retries: 60

  # One-shot: the oracle that drives Feldera and decides each claim.
  oracle:
    build: {context: recipe/oracle}
    image: feldera-recipe-oracle
    command: ["true"]
    # Lane results of the original harness (oracle/legacy.py), kept a few
    # hours so the next subject's scenario reuses them.
    volumes:
      - legacy:/cache

volumes:
  compiler:
    external: true
    name: temper-feldera-compiler
  legacy:
    external: true
    name: temper-feldera-legacy
