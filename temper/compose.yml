# The topology for Feldera's scenarios (temper/scenarios).
#
# Feldera's compiler cache lives on the external volume
# temper-feldera-compiler, so a program compiles once across runs and
# subjects; the runner's teardown (down -v) never removes an external
# volume. Each scenario creates it first (docker volume create is
# idempotent), and Docker seeds it from the image's precompiled crates.
services:
  feldera:
    image: images.feldera.com/feldera/pipeline-manager:0.383.0
    volumes:
      - compiler:/home/ubuntu/.feldera/compiler

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  postgres:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: temper, POSTGRES_DB: sink}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "sink"]
      interval: 1s
      retries: 60

  # One-shot: the oracle that drives Feldera and decides each claim.
  oracle:
    build: {context: recipe/oracle}
    image: feldera-recipe-oracle
    command: ["true"]

volumes:
  compiler:
    external: true
    name: temper-feldera-compiler
