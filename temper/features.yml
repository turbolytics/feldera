# What Feldera does, from its public docs (docs.feldera.com, v0.383.0 sources).
features:
  - id: sql.join
    description: Inner, left, full outer and self joins, maintained incrementally.
    requires: [oss]
  - id: sql.aggregate
    description: GROUP BY aggregates, HAVING, global aggregates and views over views.
    requires: [oss]
  - id: sql.window
    description: Window functions (RANK and DENSE_RANK top-k, LAG, running SUM over a RANGE frame).
    requires: [oss]
  - id: sql.tumble
    description: The TUMBLE table function for fixed event-time windows.
    requires: [oss]
  - id: sql.hop
    description: The HOP table function for sliding event-time windows.
    requires: [oss]
  - id: sql.subquery
    description: EXISTS, NOT EXISTS, IN, NOT IN and correlated scalar subqueries.
    requires: [oss]
  - id: sql.setop
    description: UNION, UNION ALL, EXCEPT, INTERSECT and DISTINCT.
    requires: [oss]
  - id: connector.http
    description: HTTP ingress with completion tokens, and HTTP egress change streams with an optional snapshot.
    requires: [oss]
  - id: connector.kafka
    description: Kafka input and output. Without fault tolerance, the output retries broker failures with no delivery deadline.
    requires: [oss]
  - id: sql.grouping
    description: GROUP BY ROLLUP, CUBE and GROUPING SETS with GROUPING().
    requires: [oss]
  - id: sql.asof
    description: LEFT ASOF JOIN with a MATCH_CONDITION on timestamps.
    requires: [oss]
  - id: sql.lateness
    description: LATENESS on timestamp columns, which lets Feldera discard state it no longer needs.
    requires: [oss]
  - id: transactions
    description: start_transaction and commit_transaction group inputs so views update once, on commit.
    requires: [oss]
  - id: sql.primary_key
    description: PRIMARY KEY tables, where inserts overwrite and updates change named columns (Uniqueness Constraints).
    requires: [oss]
  - id: sql.recursion
    description: Mutually recursive views with least-fixed-point semantics (Mutually-Recursive Queries).
    requires: [oss]
  - id: sql.now
    description: NOW() and temporal filters, re-evaluated on a step every clock_resolution (Date/time functions).
    requires: [oss]
  - id: sql.adhoc
    description: Ad-hoc SELECT queries on materialized tables and views, answered by DataFusion (Ad-hoc SQL Queries).
    requires: [oss]
  - id: sql.types
    description: Every SQL column type, encoded as JSON on HTTP and Kafka (SQL types, JSON format).
    requires: [oss]
  - id: input.errors
    description: Rejection of malformed records on ingress (JSON format).
    requires: [oss]
  - id: connector.postgres
    description: The PostgreSQL output connector in materialized mode (PostgreSQL output connector, experimental).
    requires: [oss]
  - id: runtime.workers
    description: The workers setting runs a pipeline on that many threads. It can change only while storage is cleared (Pipeline configuration).
    requires: [oss]
  - id: sql.type_semantics
    description: Equality, order and SUM for every SQL type inside stateful operators (Comparison Operations, Floating Point Operations, Array and Map comparisons, Aggregate Operations).
    requires: [oss]
